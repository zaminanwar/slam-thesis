# slam_toolbox configuration for SLAM evaluation
# Reference: https://github.com/SteveMacenski/slam_toolbox

slam_toolbox:
  ros__parameters:
    # === Frame Configuration ===
    # odom publishes odom->base_footprint, so we use base_footprint as base_frame
    # The scan is published with frame_id: laser_frame
    # TF chain: laser_frame -> base_link -> base_footprint -> odom
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # === Timing ===
    use_sim_time: true
    # Restamp TF with scan timestamps - helps with bag replay synchronization
    # This synchronizes map->odom transform timestamps with scan messages
    restamp_tf: true

    # === Mode ===
    # For bag replay evaluation, we use localization mode after initial mapping
    # But for mapping from scratch (our use case), we use mapping mode
    mode: mapping

    # === Solver Parameters ===
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # === Map Parameters ===
    resolution: 0.05
    map_update_interval: 5.0
    max_laser_range: 10.0
    minimum_time_interval: 0.5
    transform_timeout: 2.0
    tf_buffer_duration: 60.0

    # === Scan Matching ===
    use_scan_matching: true
    use_scan_barycenter: true
    # Reduced thresholds for more frequent scan matching (was 0.3/0.3)
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15

    # === Loop Closure ===
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    # Stricter loop closure variance (was 3.0) - reduces false loop closures
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # === Correlation Search ===
    # Larger search space for faster motion (was 0.5m)
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # === Loop Search ===
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0

    # === Scan Buffer ===
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # === Map Thresholds ===
    # Less permissive link matching (was 0.1) - reduces drift from weak matches
    link_match_minimum_response_fine: 0.25
    link_scan_maximum_distance: 1.5

    # === Odometry ===
    # Be more skeptical of odometry (was 0.5/1.0) - allows SLAM to correct drift
    distance_variance_penalty: 1.5
    angle_variance_penalty: 1.5
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349

    # === Stack Size ===
    stack_size_to_use: 40000000

    # === Interactive Mode ===
    enable_interactive_mode: false
