# slam_toolbox configuration for offline SLAM evaluation
# Used with bag replay for thesis experiments
#
# Mode: localization (offline processing of recorded bags)
# Robot: Differential drive with 2D LiDAR
# Frame convention: odom -> base_footprint -> base_link -> laser_frame

slam_toolbox:
  ros__parameters:
    # Plugin selection
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame configuration (match rover URDF)
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true

    # Mode: async for bag replay (processes scans as they come)
    mode: mapping  # mapping for offline SLAM, localization for live localization

    # Resolution and grid settings
    resolution: 0.05  # 5cm resolution
    max_laser_range: 10.0  # Match lidar max range
    minimum_travel_distance: 0.1  # Min travel before scan insertion (m)
    minimum_travel_heading: 0.1  # Min rotation before scan insertion (rad)

    # Scan matching parameters
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Distance variance penalty
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349  # ~0.2 degrees
    coarse_search_angle_offset: 0.349  # ~20 degrees
    coarse_angle_resolution: 0.0349  # ~2 degrees

    # Map update parameters
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # Transform publishing - CRITICAL for trajectory extraction
    transform_publish_period: 0.02  # Publish map->odom at 50Hz
    map_update_interval: 5.0  # Update occupancy grid every 5s

    # Stamped pose (for debugging/initialization)
    use_response_expansion: true
    debug_logging: false

    # Stack size for large maps
    stack_size_to_use: 40000000

    # Use simulation time for bag replay
    use_sim_time: true
